name: sinabro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1



environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  kakao_flutter_sdk_user: ^1.3.1
  kakao_flutter_sdk_auth: ^1.3.1
  google_sign_in: ^6.3.0
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.9
  shared_preferences: ^2.1.1
  audioplayers: ^5.2.0
  provider: ^6.1.1
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/auth/
    - assets/img/character/
    - assets/img/contents/gameListen/
    - assets/img/contents/gameWrite/
    - assets/img/contents/studyListen/
    - assets/img/contents/studyWrite/
    # studyWrite/test/는 studyWrite/에 포함될 수 있다면 중복을 제거합니다.
    # 만약 studyWrite/test/ 폴더가 독립적으로 존재하고, 그 안에 꼭 필요한 파일이 있다면 유지하고,
    # 그렇지 않다면 아래 주석 처리된 라인을 활성화하지 않습니다.
    # 현재 `assets/img/contents/studyWrite/`에 포함되므로 이 줄은 제거하는 것이 일반적입니다.
    # - assets/img/contents/studyWrite/test/
    - assets/img/icon/
    - assets/img/pageMain/
    - assets/img/pageSetting/

    - assets/audio/bgm/
    - assets/audio/effect/
    - assets/audio/tts/gameListen/
    - assets/audio/tts/gameWrite/
    - assets/audio/tts/studyListen/
    # studyListen/dailyConversation/, studyListen/dailyConversation/test/,
    # studyListen/soundWords/, studyListen/soundWords/test/는
    # assets/audio/tts/studyListen/ 에 포함되므로 제거합니다.
    - assets/audio/tts/studyWrite/
    # studyWrite/test/는 studyWrite/에 포함되므로 제거합니다.