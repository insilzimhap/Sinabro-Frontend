<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>문짜짜 자녀 상세 페이지</title>
  <link rel="stylesheet" href="/sinabro/web/css/header.css" />
<link rel="stylesheet" href="/sinabro/web/css/users/users_index_child.css" />

</head>

<body>
  <!-- 공통 헤더 삽입 위치 -->
  <div id="header-container"></div>

  <!-- Main content -->
  <div class="container">
    <h2>문짜짜 님 <span class="level">현재 레벨: 초급 3</span></h2>

    <div class="info-row">
      <div>
        <div class="label">아이디</div>
        <div>munjajja</div>
      </div>
      <div>
        <div class="label">이메일</div>
        <div>mjjajja@gmail.com</div>
      </div>
      <div>
        <div class="label">비밀번호</div>
        <div>asdf12345!@</div>
      </div>
    </div>

    <div class="button-container">
      <button class="delete-btn" onclick="deleteChild()">자녀 삭제하기</button>
    </div>
  </div>

  <script>
    // 공통 헤더 불러오기
    fetch("../../header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-container").innerHTML = data;
      });

    function deleteChild() {
      if (confirm("자녀 계정을 삭제하시겠습니까?")) {
        // 실제 삭제 처리 후 이동 (현재는 화면 이동만 처리)
        window.location.href = "users_index_parent.html";
      }
    }
  </script>
</body>
</html>
