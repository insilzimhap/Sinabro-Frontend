<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공지사항 관리 - 시나브로</title>
  <link rel="stylesheet" href="/web/css/header.css" />
<link rel="stylesheet" href="/web/css/board/board_notice.css" />
</head>
<body>
  <div id="header-container"></div>

  <main>
    <div class="sub-nav">
  <a href="board_notice.html" class="active">공지사항 게시판</a>
  <a href="board_qna.html">문의사항 게시판</a>
</div>

    <div class="search-bar">
      <input type="text" placeholder="검색어를 입력하세요">
      <button>검색</button>
    </div>

    <div style="text-align: right; margin-bottom: 10px;">
      <button onclick="location.href='board_notice_add.html'" class="manage-btn">공지사항 추가</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>제목</th>
          <th>작성일</th>
          <th>유형</th>
          <th>액션</th>
        </tr>
      </thead>
      <tbody id="noticeTableBody">
        <!-- JS에서 불러온 데이터가 여기에 들어감 -->
      </tbody>
    </table>
  </main>

  <script>
    fetch("/web/header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-container").innerHTML = data;
      });

      // 공지사항 목록 불러오기
    async function loadNotices() {
      try {
        const res = await fetch("http://localhost:8090/api/admin/notices"); // 백엔드 API 호출
        if (!res.ok) throw new Error("데이터 불러오기 실패");
        
        const notices = await res.json();
        const tbody = document.getElementById("noticeTableBody");
        tbody.innerHTML = "";

        // 최신순 정렬
        notices.sort((a, b) => b.id - a.id);

        notices.forEach((notice, index) => {
          const row = `
            <tr>
              <td>${index + 1}</td>
              <td>${notice.title}</td>
              <td>${notice.createdDate ? notice.createdDate.split("T")[0] : ""}</td>
              <td>${notice.noticeType || ""}</td>
              <td>
                <button onclick="location.href='board_index_no_update.html?id=${notice.id}'" class="manage-btn">관리</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (err) {
        console.error(err);
        alert("공지사항 목록을 불러오는 중 오류가 발생했습니다.");
      }
    }

    // 페이지 로드 시 실행
    window.onload = loadNotices;
  </script>
</body>
</html>
