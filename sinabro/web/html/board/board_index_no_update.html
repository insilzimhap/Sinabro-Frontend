<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공지사항 관리 - 시나브로</title>
  <link rel="stylesheet" href="../../css/header.css" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
    }

    main {
      padding: 50px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 600px;
    }

    .container h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group .value {
      padding: 10px;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 4px;
      white-space: pre-line;
    }

    .button-row {
      text-align: center;
      margin-top: 20px;
    }

    .button-row button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      margin: 0 5px;
      cursor: pointer;
      font-size: 14px;
      color: white;
    }

    .update-btn {
      background-color: #4caf50;
    }

    .delete-btn {
      background-color: #f44336;
    }

    .cancel-btn {
      background-color: #777;
    }
  </style>
</head>
<body>
  <div id="header-container"></div>
  <main>
    <div class="container">
      <h2>공지사항</h2>

      <div class="form-group">
        <label>제목</label>
        <div class="value">시스템 점검 안내</div>
      </div>

      <div class="form-group">
        <label>내용</label>
        <div class="value">금일 22:00 시스템 점검이 예정되어 있습니다.</div>
      </div>

      <div class="form-group">
        <label>작성일</label>
        <div class="value">2025-04-11</div>
      </div>

      <div class="form-group">
        <label>작성자</label>
        <div class="value">관리자</div>
      </div>

      <div class="button-row">
        <button class="update-btn" onclick="location.href='board_edit.html'">수정하기</button>
        <button class="delete-btn">삭제하기</button>
        <button class="cancel-btn" onclick="location.href='board_notice.html'">취소하기</button>
      </div>
    </div>
  </main>
  <script>
    // 공통 헤더 삽입
    fetch("../../header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-container").innerHTML = data;
      });

    function saveReply() {
      const replyText = document.getElementById('reply').value.trim();
      if (replyText) {
        alert('답변이 저장되었습니다!');
        window.location.href = 'board_qna.html';
      } else {
        alert('답변을 입력해주세요!');
      }
    }
  </script>
</body>
</html>
