<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공지사항 관리 - 시나브로</title>
  <link rel="stylesheet" href="/sinabro/web/css/header.css" />
<link rel="stylesheet" href="/sinabro/web/css/board/board_index_no_update.css" />
</head>
<body>
  <div id="header-container"></div>
  <main>
    <div class="container">
      <h2>공지사항</h2>

      <div class="form-group">
        <label>제목</label>
        <div class="value">시스템 점검 안내</div>
      </div>

      <div class="form-group">
        <label>내용</label>
        <div class="value">금일 22:00 시스템 점검이 예정되어 있습니다.</div>
      </div>

      <div class="form-group">
        <label>작성일</label>
        <div class="value">2025-04-11</div>
      </div>

      <div class="form-group">
        <label>작성자</label>
        <div class="value">관리자</div>
      </div>

      <div class="button-row">
        <button class="update-btn" onclick="location.href='board_edit.html'">수정하기</button>
        <button class="delete-btn" onclick="deleteNotice()">삭제하기</button>
        <button class="cancel-btn" onclick="location.href='board_notice.html'">취소하기</button>
      </div>
    </div>
  </main>

  <script>
    fetch("../../header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-container").innerHTML = data;
      });

    function deleteNotice() {
      if (confirm("공지사항을 삭제하시겠습니까?")) {
        // 실제 삭제 처리 로직 필요 시 추가
        alert("삭제되었습니다.");
        window.location.href = 'board_notice.html';
      }
    }
  </script>
</body>
</html>
