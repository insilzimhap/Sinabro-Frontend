<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>듣기 학습 - 콘텐츠 관리</title>
  <link rel="stylesheet" href="/sinabro/web/css/header.css" />
<link rel="stylesheet" href="/sinabro/web/css/contents/contents_index_control.css" />

</head>
<body>

  <!-- 공통 헤더 삽입 -->
  <div id="header-container"></div>

  <main>
    <div class="container">
      <h2>듣기 학습 - 컨텐츠 관리</h2>

      <div class="search-bar">
        <select>
          <option value="all">전체</option>
          <option value="easy">초급</option>
          <option value="medium">중급</option>
          <option value="hard">고급</option>
        </select>
        <input type="text" placeholder="검색어를 입력하세요">
        <button>검색</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>제목</th>
            <th>설명</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>따라쓰기1</td>
            <td>기초 따라쓰기</td>
            <td>
              <button class="action-btn">수정</button>
              <button class="action-btn">삭제</button>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>따라쓰기2</td>
            <td>중급 따라쓰기</td>
            <td>
              <button class="action-btn">수정</button>
              <button class="action-btn">삭제</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="add-form">
        <input type="text" placeholder="제목 입력">
        <input type="text" placeholder="설명 입력">
        <select>
          <option value="easy">초급</option>
          <option value="medium">중급</option>
          <option value="hard">고급</option>
        </select>
        <button>추가하기</button>
      </div>
    </div>
  </main>

  <script>
    // 공통 헤더 로딩
    fetch("../../header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-container").innerHTML = data;
      });
  </script>

</body>
</html>
