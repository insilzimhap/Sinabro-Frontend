<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>콘텐츠 관리 - 시나브로</title>
   <link rel="stylesheet" href="/sinabro/web/css/header.css" />
<link rel="stylesheet" href="/sinabro/web/css/contents/contents_index.css" />
</head>
<body>

  <!-- 공통 헤더 삽입 -->
  <div id="header-container"></div>

  <main>
    <div class="container">
      <h2>콘텐츠 관리</h2>

      <div class="search-bar">
        <select>
          <option value="all">전체</option>
          <option value="listen">듣기 학습</option>
          <option value="write">쓰기 학습</option>
          <option value="game">게임</option>
        </select>
        <input type="text" placeholder="검색어를 입력하세요">
        <button>검색</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>분류</th>
            <th>난이도</th>
            <th>세부사항</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>듣기 학습</td>
            <td></td>
            <td>의성어/의태어</td>
            <td><button onclick="location.href='contents_index_control.html'" class="action-btn">관리</button></td>
          </tr>
          <tr>
            <td>2</td>
            <td>쓰기 학습</td>
            <td>상</td>
            <td>따라쓰기</td>
            <td><button class="action-btn">관리</button></td>
          </tr>
          <tr>
            <td>3</td>
            <td>쓰기 학습</td>
            <td>하</td>
            <td>따라쓰기</td>
            <td><button class="action-btn">관리</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // 공통 헤더 로딩
    fetch("../../header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-container").innerHTML = data;
      });
  </script>

</body>
</html>
